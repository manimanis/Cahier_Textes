<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cahier de textes</title>
  <link rel="stylesheet" href="styles/bootstrap.min.css">
  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/style.css">
</head>

<body>
  <main id="app">
    <article class="container" v-if="selectedClasse == ''">
      <h1>Cahier de textes</h1>
      
      <!-- Navigation links + year selector -->
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap" style="gap:0.5rem;">
        <div class="d-flex" style="gap:0.5rem;">
          <a href="calendrier.html" class="btn btn-primary btn-sm">📅 Calendrier</a>
          <a href="emploi_temps.html" class="btn btn-primary btn-sm">⏰ Emploi du temps</a>
          <a href="gestion.html" class="btn btn-outline-secondary btn-sm">⚙️ Gestion</a>
        </div>
        <select class="form-control form-control-sm" v-model="selectedYear" v-on:change="changeYear()"
          style="width:auto;min-width:130px;" v-if="years.length > 0">
          <option v-for="y in years" :key="y.label" :value="y.label">{{y.label}}</option>
        </select>
      </div>

      <div class="container index-page row">
        <div v-for="classe in classes" class="col-md-6 my-3">
          <a class="btn btn-success w-100 p-5" v-on:click.prevent="onClasseChanged(classe.shortName)"
            v-html="classe.longName"></a>
        </div>
      </div>
    </article>

    <article class="container" v-if="selectedClasse != ''">
      <h1>Classe {{selectedClasse}}</h1>
      <div class="row">
        <div class="col-sm-6 annee-scolaire">{{annee_scolaire}}</div>
        <div class="col-sm-6 enseignant">{{enseignant}}</div>
      </div>

      <div class="my-2 d-print-none">
        <a href="#" v-on:click.prevent="onClasseChanged('')">&larr; Liste des classes</a>
      </div>

      <section v-for="seance, idx in seances[selectedClasse]">
        <h2><small>Séance {{seance.index}} : </small>{{seance.titre}}</h2>
        <div class="row">
          <div class="col-sm-3 date">{{formatDate(seance.date)}}</div>
          <div class="col-sm-3 heure">{{seance.debut}} &rarr; {{seance.fin}}</div>
          <div class="col-sm-6 groupe">{{seance.groupe}}</div>
        </div>
        <div class="remarque" v-if="seance.remarque" v-html="seance.remarque"></div>
        <div class="travail" v-html="seance.travail"></div>
      </section>
    </article>

  </main>
  <script src="scripts/jquery.min.js" defer></script>
  <script src="scripts/bootstrap.min.js" defer></script>
  <script src="scripts/vue.min.js" defer></script>
  <script src="scripts/entities.js" defer></script>
  <script src="scripts/app3.js" defer></script>
</body>

</html>
